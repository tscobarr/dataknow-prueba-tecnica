<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>DataKnow — Arquitectura AWS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0a0a0f;padding:40px;color:#fff}
.container{max-width:1200px;margin:0 auto}

</head>
<body>

<p class="sub">Implementación actual + propuesta de automatización futura</p>

  </defs>

  <rect width="1060" height="700" fill="url(#g)"/>

  <!-- ZONE 1: AGENTE IA                                             -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <text x="415" y="192" fill="#f59e0b" font-size="6" text-anchor="middle">invoke_model</text>

  <text x="509" y="172" fill="#94a3b8" font-size="6" text-anchor="middle">HTTP</text>

  <text x="585" y="462" fill="#fff" font-size="10" font-weight="600" text-anchor="middle">S3 Output</text>

  <line x1="315" y1="462" x2="368" y2="462" stroke="#22c55e" stroke-width="1.5" marker-end="url(#ar-g)"/>

  <!-- ═══════════════════════════════════════════════════════════════ -->

  <text x="875" y="263" fill="#94a3b8" font-size="7" text-anchor="middle">Alerta de costos &lt; $1</text>

  <rect x="738" y="289" width="275" height="48" rx="6" fill="rgba(239,68,68,0.08)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="875" y="311" fill="#fff" font-size="10" font-weight="600" text-anchor="middle">AWS KMS</text>
  <text x="875" y="326" fill="#94a3b8" font-size="7" text-anchor="middle">Encriptación en reposo</text>

  <rect x="738" y="352" width="275" height="48" rx="6" fill="rgba(239,68,68,0.08)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="875" y="374" fill="#fff" font-size="10" font-weight="600" text-anchor="middle">Amazon VPC</text>
  <text x="875" y="389" fill="#94a3b8" font-size="7" text-anchor="middle">Security Group · Subnet pública</text>

  <!-- Monitoring: EC2 → CloudWatch -->

  <rect x="450" y="177" width="60" height="16" rx="3" fill="#0f172a"/>
  <text x="480" y="188" fill="#ef4444" font-size="7" text-anchor="middle">logs</text>

  <!-- Legend -->
  <rect x="738" y="420" width="170" height="140" rx="6" fill="rgba(15,23,42,0.6)" stroke="#1e293b" stroke-width="1"/>
  <text x="823" y="442" fill="#fff" font-size="10" font-weight="600" text-anchor="middle">Leyenda</text>

  <rect x="753" y="455" width="10" height="8" rx="2" fill="rgba(6,182,212,0.2)" stroke="#06b6d4" stroke-width="1"/><text x="770" y="463" fill="#94a3b8" font-size="7">Red / Frontend</text>
  <rect x="753" y="470" width="10" height="8" rx="2" fill="rgba(34,197,94,0.2)" stroke="#22c55e" stroke-width="1"/><text x="770" y="478" fill="#94a3b8" font-size="7">Cómputo</text>
  <rect x="753" y="485" width="10" height="8" rx="2" fill="rgba(245,158,11,0.2)" stroke="#f59e0b" stroke-width="1"/><text x="770" y="493" fill="#94a3b8" font-size="7">Servicio AWS</text>
  <rect x="753" y="500" width="10" height="8" rx="2" fill="rgba(239,68,68,0.2)" stroke="#ef4444" stroke-width="1"/><text x="770" y="508" fill="#94a3b8" font-size="7">Seguridad / Obs.</text>
  <rect x="753" y="515" width="10" height="8" rx="2" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1"/><text x="770" y="523" fill="#94a3b8" font-size="7">Servicio externo</text>
  <line x1="753" y1="535" x2="763" y2="535" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/><text x="770" y="538" fill="#94a3b8" font-size="7">Flujo de datos</text>

  <!-- Footer -->
  <text x="530" y="660" fill="#475569" font-size="7" text-anchor="middle">DataKnow Prueba Técnica · Julio 2026 · Diagrama de arquitectura AWS</text>

</svg>
